name: Access Control Verification
on:
  pull_request:
  push:
    branches: [main, master, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable verification environment
        run: docker build -f scripts/Dockerfile.access-tests -t lca-access-tests .
      - name: Verify without external network access or production credentials
        run: docker run --rm --network none lca-access-tests
